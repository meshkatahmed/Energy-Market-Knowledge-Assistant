name: Docker Image CI/CD 

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:

      # If need to run any code from the runner itself then needed otherwise can be removed
      - name: Checkout repository
        uses: actions/checkout@v6
        
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and Push
        uses: docker/build-push-action@v7
        with: 
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/${{ github.event.repository.name }}-backend:latest
      
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Link Railway Project
        run: railway link --project ${{ vars.RAILWAY_PROJECT_ID }} --environment production
        env: 
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Redeploy Railway Service
        run: railway redeploy --service ${{ vars.RAILWAY_SERVICE_ID }}
        env: 
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
         
        # --project ${{ vars.RAILWAY_PROJECT_ID }} --environment production